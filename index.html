<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal QR Generator</title>
    <link rel="stylesheet" href="styles.css">
    <script type="text/javascript" src="qr-code-styling.js"></script>
</head>
<body>

<header class="app-header">
    <div class="app-header-inner">
        <div class="app-logo">
            <svg width="28" height="28" viewBox="0 0 28 28" fill="none"><rect x="2" y="2" width="10" height="10" rx="2" fill="#4f6ef7"/><rect x="16" y="2" width="10" height="10" rx="2" fill="#4f6ef7" opacity=".6"/><rect x="2" y="16" width="10" height="10" rx="2" fill="#4f6ef7" opacity=".6"/><rect x="18" y="18" width="6" height="6" rx="1" fill="#6ee7b7"/><rect x="16" y="16" width="4" height="4" rx="1" fill="#6ee7b7" opacity=".4"/></svg>
            <span>QRme</span>
        </div>
        <button class="theme-toggle" id="themeToggle" title="Toggle theme">☀️</button>
    </div>
</header>

<div class="container">

    <!-- ===== LEFT: CONTROLS ===== -->
    <div class="controls">

        <!-- ── QR TYPE TABS ── -->
        <div class="section-block">
            <p class="section-title">QR Type</p>
            <div class="tabs" id="tabContainer">
                <button class="tab-btn active" data-type="url">URL</button>
                <button class="tab-btn" data-type="text">Text</button>
                <button class="tab-btn" data-type="wifi">WiFi</button>
                <button class="tab-btn" data-type="vcard">vCard</button>
                <button class="tab-btn" data-type="whatsapp">WhatsApp</button>
                <button class="tab-btn" data-type="sms">SMS</button>
                <button class="tab-btn" data-type="email">Email</button>
                <button class="tab-btn" data-type="phone">Phone</button>
                <button class="tab-btn" data-type="crypto">Crypto</button>
                <button class="tab-btn" data-type="event">Event</button>
                <button class="tab-btn" data-type="location">Location</button>
                <button class="tab-btn" data-type="applink">App Link</button>
                <button class="tab-btn" data-type="esim">eSIM</button>
            </div>

            <!-- Form: URL -->
            <div id="form-url" class="qr-form active">
                <div class="control-group">
                    <label>Website URL</label>
                    <input type="text" id="urlInput" value="https://example.com" placeholder="https://...">
                </div>
            </div>

            <!-- Form: Text -->
            <div id="form-text" class="qr-form">
                <div class="control-group">
                    <label>Plain Text</label>
                    <textarea id="textInput" placeholder="Enter your text here..."></textarea>
                </div>
            </div>

            <!-- Form: WiFi -->
            <div id="form-wifi" class="qr-form">
                <div class="grid-2">
                    <div class="control-group">
                        <label>Network Name (SSID)</label>
                        <input type="text" id="wifiSsid" placeholder="MyWiFiNetwork">
                    </div>
                    <div class="control-group">
                        <label>Password</label>
                        <input type="text" id="wifiPass" placeholder="Password123">
                    </div>
                    <div class="control-group">
                        <label>Encryption</label>
                        <select id="wifiType">
                            <option value="WPA">WPA/WPA2/WPA3</option>
                            <option value="WEP">WEP</option>
                            <option value="nopass">None</option>
                        </select>
                    </div>
                    <div class="inline-check" style="margin-top:1.5rem">
                        <input type="checkbox" id="wifiHidden">
                        <label for="wifiHidden">Hidden Network</label>
                    </div>
                </div>
            </div>

            <!-- Form: vCard (dynamic iPhone-style) -->
            <div id="form-vcard" class="qr-form">

                <!-- Fixed: Name block -->
                <div class="vcard-name-block">
                    <div class="vcard-name-row">
                        <input type="text" id="vcardFirst" placeholder="First name" class="vcard-name-input">
                        <input type="text" id="vcardLast"  placeholder="Last name"  class="vcard-name-input">
                    </div>
                    <input type="text" id="vcardCompany" placeholder="Company" class="vcard-company-input">
                </div>

                <!-- Dynamic fields list -->
                <div id="vcardFieldList" class="vcard-field-list"></div>

                <!-- Add field button -->
                <div class="vcard-add-row" id="vcardAddRow">
                    <button class="vcard-add-main-btn" id="vcardAddBtn">
                        <span class="vcard-add-icon">+</span>
                        add field
                    </button>
                </div>

                <!-- Field type picker (hidden sheet) -->
                <div class="vcard-picker-sheet hidden" id="vcardPickerSheet">
                    <div class="vcard-picker-header">
                        <span>Add Field</span>
                        <button class="vcard-picker-close" id="vcardPickerClose">✕</button>
                    </div>
                    <div class="vcard-picker-list" id="vcardPickerList"></div>
                </div>

            </div>

            <!-- Form: WhatsApp -->
            <div id="form-whatsapp" class="qr-form">
                <div class="control-group"><label>Phone (with country code)</label><input type="text" id="waPhone" placeholder="1234567890"></div>
                <div class="control-group" style="margin-top:1rem"><label>Pre-filled Message</label><textarea id="waMessage" placeholder="Hello!"></textarea></div>
            </div>

            <!-- Form: SMS -->
            <div id="form-sms" class="qr-form">
                <div class="control-group"><label>Phone Number</label><input type="text" id="smsPhone" placeholder="1234567890"></div>
                <div class="control-group" style="margin-top:1rem"><label>Message</label><textarea id="smsMessage" placeholder="Type message..."></textarea></div>
            </div>

            <!-- Form: Email -->
            <div id="form-email" class="qr-form">
                <div class="control-group"><label>Send To</label><input type="text" id="emailAddress" placeholder="hello@example.com"></div>
                <div class="control-group" style="margin-top:.75rem"><label>Subject</label><input type="text" id="emailSubject" placeholder="Inquiry"></div>
                <div class="control-group" style="margin-top:.75rem"><label>Body</label><textarea id="emailBody" placeholder="Write email here..."></textarea></div>
            </div>

            <!-- Form: Phone Call -->
            <div id="form-phone" class="qr-form">
                <div class="control-group">
                    <label>Phone Number (with country code)</label>
                    <input type="text" id="phoneNumber" placeholder="+1234567890">
                </div>
            </div>

            <!-- Form: Crypto -->
            <div id="form-crypto" class="qr-form">
                <div class="grid-2">
                    <div class="control-group">
                        <label>Coin</label>
                        <select id="cryptoCoin">
                            <option value="bitcoin">Bitcoin (BTC)</option>
                            <option value="ethereum">Ethereum (ETH)</option>
                            <option value="litecoin">Litecoin (LTC)</option>
                        </select>
                    </div>
                    <div class="control-group">
                        <label>Amount (optional)</label>
                        <input type="text" id="cryptoAmount" placeholder="0.001">
                    </div>
                    <div class="control-group" style="grid-column:span 2">
                        <label>Wallet Address</label>
                        <input type="text" id="cryptoAddress" placeholder="1A1zP1eP5QGefi2DMPTfTL5SLmv7Divf...">
                    </div>
                    <div class="control-group" style="grid-column:span 2">
                        <label>Label / Note (optional)</label>
                        <input type="text" id="cryptoLabel" placeholder="Payment for invoice #42">
                    </div>
                </div>
            </div>

            <!-- Form: Calendar Event -->
            <div id="form-event" class="qr-form">
                <div class="grid-2">
                    <div class="control-group" style="grid-column:span 2"><label>Event Title</label><input type="text" id="eventTitle" placeholder="Team Meeting"></div>
                    <div class="control-group"><label>Start Date & Time</label><input type="datetime-local" id="eventStart"></div>
                    <div class="control-group"><label>End Date & Time</label><input type="datetime-local" id="eventEnd"></div>
                    <div class="control-group" style="grid-column:span 2"><label>Location</label><input type="text" id="eventLocation" placeholder="Conference Room / Zoom link"></div>
                    <div class="control-group" style="grid-column:span 2"><label>Description</label><textarea id="eventDesc" placeholder="Meeting agenda..."></textarea></div>
                </div>
            </div>

            <!-- Form: Location -->
            <div id="form-location" class="qr-form">
                <div class="grid-2">
                    <div class="control-group"><label>Latitude</label><input type="text" id="locLat" placeholder="40.7128"></div>
                    <div class="control-group"><label>Longitude</label><input type="text" id="locLng" placeholder="-74.0060"></div>
                    <div class="control-group" style="grid-column:span 2"><label>Or enter a place name / address</label><input type="text" id="locQuery" placeholder="Eiffel Tower, Paris"></div>
                </div>
                <p class="form-hint">Coordinates take priority over place name if both are filled.</p>
            </div>

            <!-- Form: App Link -->
            <div id="form-applink" class="qr-form">
                <div class="grid-2">
                    <div class="control-group">
                        <label>Platform</label>
                        <select id="appPlatform">
                            <option value="ios">App Store (iOS)</option>
                            <option value="android">Play Store (Android)</option>
                            <option value="both">Smart Link (both)</option>
                        </select>
                    </div>
                    <div class="control-group">
                        <label>App ID / Package</label>
                        <input type="text" id="appId" placeholder="com.example.app or 123456789">
                    </div>
                </div>
                <p class="form-hint">For iOS enter the numeric App Store ID. For Android use the package name.</p>
            </div>

            <!-- Form: eSIM -->
            <div id="form-esim" class="qr-form">
                <div class="grid-2">
                    <div class="control-group"><label>SM-DP+ Address</label><input type="text" id="esimSmdp" value="rsp.truphone.com"></div>
                    <div class="control-group"><label>Activation Code</label><input type="text" id="esimCode" value="ACT-12345"></div>
                </div>
            </div>

            <!-- Raw String -->
            <div class="control-group" style="margin-top:1.25rem">
                <label>Raw QR Data</label>
                <div id="rawStringDisplay" class="readonly-string">https://example.com</div>
            </div>
        </div>

        <div class="divider"></div>

        <!-- ── DESIGN PATTERN ── -->
        <div class="section-block">
            <p class="section-title">Design Pattern</p>
            <div class="grid-2">
                <div class="control-group">
                    <label>Central Pattern</label>
                    <select id="dotStyle">
                        <option value="square">Square</option>
                        <option value="dots">Dots</option>
                        <option value="rounded" selected>Rounded</option>
                        <option value="extra-rounded">Extra Rounded</option>
                        <option value="classy">Classy</option>
                        <option value="classy-rounded">Classy Rounded</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>Outer Corner</label>
                    <select id="cornerSquareStyle">
                        <option value="square">Square</option>
                        <option value="dot">Dot</option>
                        <option value="extra-rounded" selected>Extra Rounded</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>Inner Corner</label>
                    <select id="cornerDotStyle">
                        <option value="square">Square</option>
                        <option value="dot" selected>Dot</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>Error Correction</label>
                    <select id="correctionLevel">
                        <option value="L">Low (7%)</option>
                        <option value="M">Medium (15%)</option>
                        <option value="Q" selected>Quartile (25%)</option>
                        <option value="H">High (30%)</option>
                    </select>
                </div>
            </div>
            <!-- QR Size -->
            <div class="control-group" style="margin-top:.85rem">
                <label>QR Size — <span id="sizeLabel">300</span>px</label>
                <input type="range" id="qrSize" min="150" max="600" step="10" value="300" class="range-slider">
            </div>
            <!-- Margin -->
            <div class="control-group" style="margin-top:.85rem">
                <label>Quiet Zone (margin) — <span id="marginLabel">16</span>px</label>
                <input type="range" id="qrMargin" min="0" max="60" step="4" value="16" class="range-slider">
            </div>
        </div>

        <div class="divider"></div>

        <!-- ── COLORS ── -->
        <div class="section-block">
            <p class="section-title">Colors</p>

            <!-- Preset Themes -->
            <div class="theme-presets" id="themePresets">
                <button class="preset-btn" data-preset="classic" title="Classic">⬛</button>
                <button class="preset-btn" data-preset="ocean" title="Ocean">🌊</button>
                <button class="preset-btn" data-preset="forest" title="Forest">🌲</button>
                <button class="preset-btn" data-preset="rose" title="Rose">🌹</button>
                <button class="preset-btn" data-preset="neon" title="Neon">⚡</button>
                <button class="preset-btn" data-preset="gold" title="Gold">✨</button>
                <button class="preset-btn" data-preset="midnight" title="Midnight">🌙</button>
            </div>

            <div class="grid-2" style="margin-top:.85rem">
                <div class="control-group">
                    <label>Background</label>
                    <input type="color" id="bgColor" value="#ffffff">
                    <div class="inline-check" style="margin-top:.3rem">
                        <input type="checkbox" id="transparentBg">
                        <label for="transparentBg">Transparent</label>
                    </div>
                </div>
                <div class="control-group">
                    <label>Pattern Color</label>
                    <input type="color" id="dotColor" value="#000000">
                </div>
                <div class="control-group">
                    <label>Outer Corner</label>
                    <input type="color" id="cornerSquareColor" value="#000000">
                </div>
                <div class="control-group">
                    <label>Inner Corner</label>
                    <input type="color" id="cornerDotColor" value="#000000">
                </div>
            </div>
        </div>

        <div class="divider"></div>

        <!-- ── LOGO ── -->
        <div class="section-block">
            <p class="section-title">Logo</p>
            <div class="control-group">
                <label>Upload Image</label>
                <input type="file" id="logoUpload" accept="image/*">
            </div>
            <div class="grid-2" style="margin-top:.75rem">
                <div class="control-group">
                    <label>Logo Size — <span id="logoSizeLabel">40</span>%</label>
                    <input type="range" id="logoSize" min="10" max="60" step="5" value="40" class="range-slider">
                </div>
                <div class="control-group">
                    <label>Logo Margin — <span id="logoMarginLabel">6</span>px</label>
                    <input type="range" id="logoMargin" min="0" max="20" step="2" value="6" class="range-slider">
                </div>
            </div>
            <div class="inline-check" style="margin-top:.75rem">
                <input type="checkbox" id="hideDots" checked>
                <label for="hideDots">Hide dots behind logo</label>
            </div>
            <button class="ghost-btn" id="clearLogoBtn" style="margin-top:.75rem">✕ Remove Logo</button>
        </div>

        <div class="divider"></div>

        <!-- ── FRAME ── -->
        <div class="section-block">
            <p class="section-title">Frame & Label</p>
            <div class="inline-check" style="margin-bottom:.75rem">
                <input type="checkbox" id="enableFrame">
                <label for="enableFrame">Add frame around QR</label>
            </div>
            <div id="frameOptions" class="frame-options hidden">
                <div class="grid-2">
                    <div class="control-group"><label>Frame Color</label><input type="color" id="frameColor" value="#4f6ef7"></div>
                    <div class="control-group"><label>Label Text</label><input type="text" id="frameLabel" placeholder="SCAN ME"></div>
                    <div class="control-group"><label>Text Color</label><input type="color" id="frameLabelColor" value="#ffffff"></div>
                    <div class="control-group">
                        <label>Frame Style</label>
                        <select id="frameStyle">
                            <option value="simple">Simple Border</option>
                            <option value="banner">Bottom Banner</option>
                            <option value="rounded">Rounded Card</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

    </div><!-- end .controls -->

    <!-- ===== RIGHT: PREVIEW ===== -->
    <div class="preview-panel">
        <p class="section-title" style="align-self:flex-start">Preview</p>

        <div id="qr-wrapper">
            <div id="qr-canvas"></div>
        </div>

        <!-- Export buttons -->
        <div class="export-btns">
            <button class="download-btn primary-btn" id="downloadPng">⬇ PNG</button>
            <button class="download-btn ghost-btn"   id="downloadSvg">⬇ SVG</button>
            <button class="download-btn ghost-btn"   id="downloadJpeg">⬇ JPEG</button>
            <button class="download-btn ghost-btn"   id="copyClipboard">⧉ Copy</button>
        </div>

        <!-- Toast -->
        <div id="toast" class="toast hidden">✓ Copied to clipboard!</div>

        <!-- History -->
        <div class="history-section">
            <div class="history-header">
                <p class="section-title" style="margin:0">Recent</p>
                <button class="ghost-btn small" id="clearHistory">Clear</button>
            </div>
            <div id="historyList" class="history-list"></div>
        </div>
    </div>

</div><!-- end .container -->

<script src="app.js"></script>
</body>
</html>
